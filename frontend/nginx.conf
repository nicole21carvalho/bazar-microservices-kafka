# Serve o painel (arquivos estaticos). No docker compose, a API e o Keycloak
# ficam em outros enderecos (__API__ e __KEYCLOAK__, trocados no build da
# imagem). No Kubernetes, tudo fica no mesmo endereco e os dois vem vazios:
# a CSP fica so com 'self'.
server {
    # 8080 e nao 80: a imagem roda sem root, e porta abaixo de 1024 exige root.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Depois da primeira visita, o navegador so usa HTTPS neste endereco. Em
    # http://localhost ele ignora o cabecalho (so vale vindo por HTTPS).
    add_header Strict-Transport-Security "max-age=31536000" always;
    # CSP rigida, sem 'unsafe-inline': o build do Vite nao gera script inline,
    # entao so roda JavaScript vindo deste mesmo endereco. connect-src lista os
    # unicos destinos que a pagina pode chamar (API e Keycloak); frame-src
    # permite o iframe invisivel que renova a sessao.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' __API__ __KEYCLOAK__; frame-src 'self' __KEYCLOAK__; frame-ancestors 'self'; form-action 'self' __KEYCLOAK__; base-uri 'self'; object-src 'none'" always;

    # Arquivos com hash no nome: cache para sempre, qualquer mudanca gera outro nome.
    location /assets/ {
        # Sem isto, o add_header daqui apagaria os cabecalhos de seguranca acima.
        add_header_inherit merge;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header_inherit merge;
        # O index.html nunca fica em cache: uma versao nova aparece no proximo acesso.
        add_header Cache-Control "no-cache" always;
        # Rotas da aplicacao (/callback, /silent): todas servem o index.html.
        try_files $uri /index.html;
    }
}
