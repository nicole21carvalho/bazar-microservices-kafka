# Padroes para todos os servicos da Sagaz. O application.yml de cada servico
# tem prioridade sobre estes valores.

# O KafkaTemplate poe o traceparent no cabecalho de cada mensagem, e o listener
# continua o trace a partir dele: um pedido vira um trace so, do clique ao e-mail.
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# 100% dos traces porque e uma demonstracao. Com trafego real, 5% a 10% ja
# mostram o comportamento do sistema com uma fracao do custo.
management.tracing.sampling.probability=${AMOSTRAGEM_TRACES:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES:http://localhost:4318/v1/traces}
