# Sobe tudo com: docker compose up -d --build

x-seguro: &seguro
  # Nenhum processo dentro ganha mais privilegio que o container tem, e o
  # container nao tem nenhuma capacidade especial do Linux.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-servico: &servico
  <<: *seguro
  build:
    context: .
  read_only: true
  tmpfs:
    - /tmp:size=64m
  environment: &ambiente
    DB_HOST: db
    KAFKA_SERVIDORES: kafka:9092
    DB_SENHA_PEDIDOS: ${DB_SENHA_PEDIDOS:?defina no .env}
    DB_SENHA_ESTOQUE: ${DB_SENHA_ESTOQUE:?defina no .env}
    DB_SENHA_PAGAMENTOS: ${DB_SENHA_PAGAMENTOS:?defina no .env}
    DB_SENHA_NOTIFICACOES: ${DB_SENHA_NOTIFICACOES:?defina no .env}
    OTLP_TRACES: http://jaeger:4318/v1/traces
    JAVA_TOOL_OPTIONS: -XX:+UseSerialGC
  mem_limit: 512m
  depends_on:
    db:
      condition: service_healthy
    kafka-topicos:
      condition: service_completed_successfully

services:
  db:
    image: postgres:18-alpine
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_PASSWORD: ${DB_SENHA_ADMIN:?defina no .env}
      DB_SENHA_PEDIDOS: ${DB_SENHA_PEDIDOS:?defina no .env}
      DB_SENHA_ESTOQUE: ${DB_SENHA_ESTOQUE:?defina no .env}
      DB_SENHA_PAGAMENTOS: ${DB_SENHA_PAGAMENTOS:?defina no .env}
      DB_SENHA_NOTIFICACOES: ${DB_SENHA_NOTIFICACOES:?defina no .env}
      DB_SENHA_KEYCLOAK: ${DB_SENHA_KEYCLOAK:?defina no .env}
      # Na primeira subida, o entrypoint cria os bancos num servidor
      # temporario e o desliga com pg_ctl, que desiste em 60 s. Com a maquina
      # carregada isso ja falhou e derrubou o container; 5 minutos de folga.
      PGCTLTIMEOUT: "300"
    volumes:
      # No Postgres 18 o volume vai em /var/lib/postgresql, e nao em .../data.
      - dados_postgres:/var/lib/postgresql
      - ./infra/postgres/criar-bancos.sh:/docker-entrypoint-initdb.d/criar-bancos.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      # Na primeira subida o Postgres cria os 5 bancos antes de aceitar
      # conexao; numa maquina ocupada (build das imagens rodando junto), isso
      # passa de 1 minuto e as falhas desse periodo nao contam.
      start_period: 90s

  kafka:
    image: apache/kafka:4.3.1
    <<: *seguro
    environment:
      # KRaft: o Kafka coordena o proprio cluster, sem ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Um broker so: fator de replicacao 1. Em producao, 3 brokers e fator 3.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topicos criados de proposito (kafka-topicos abaixo), nunca por engano
      # de digitacao num nome de topico.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - dados_kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Cria os topicos e termina. 3 particoes: ate 3 replicas de cada servico
  # consomem em paralelo, e a chave (pedidoId) mantem a ordem de cada pedido.
  kafka-topicos:
    image: apache/kafka:4.3.1
    <<: *seguro
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        # Retencao: 7 dias nos topicos (o registro de idempotencia guarda 14),
        # 30 dias no DLT, para dar tempo de alguem investigar a mensagem.
        criar() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic $$1 --partitions 3 --replication-factor 1 \
            --config retention.ms=$$2
        }
        for t in vitrine.pedidos vitrine.estoque vitrine.pagamentos; do
          criar $$t 604800000
          criar $$t-dlt 2592000000
        done
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    <<: *seguro
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_SENHA_ADMIN:?defina no .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_SENHA_KEYCLOAK:?defina no .env}
      # O endereco que o navegador usa: vai no "iss" de todo token. Os servicos
      # buscam as chaves pelo endereco interno (keycloak:8080).
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # HTTP so porque e local. Exposto na internet, Keycloak so com HTTPS.
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/vitrine-realm.json:/opt/keycloak/data/import/vitrine-realm.json:ro
    ports:
      - "127.0.0.1:8180:8080"
    # Com 768 MB ele ficava em ~85% de uso e a coleta de lixo deixava o
    # login lento (requisicao de token passando de 5 s).
    mem_limit: 1024m
    healthcheck:
      # A imagem nao tem curl: a checagem fala HTTP direto pelo /dev/tcp do bash.
      # Aspas simples no YAML: as barras chegam intactas ao printf, que as interpreta.
      test: ["CMD-SHELL", 'exec 3<>/dev/tcp/localhost/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "200 OK" <&3']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  gateway:
    <<: *seguro
    build:
      context: .
      args:
        SERVICO: gateway
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 384m
    environment:
      ESTOQUE_URL: http://estoque:8082
      PEDIDOS_URL: http://pedidos:8081
      KEYCLOAK_EMISSOR: http://localhost:8180/realms/vitrine
      KEYCLOAK_CHAVES: http://keycloak:8080/realms/vitrine/protocol/openid-connect/certs
      CORS_ORIGENS: http://localhost:5173
      OTLP_TRACES: http://jaeger:4318/v1/traces
      JAVA_TOOL_OPTIONS: -XX:+UseSerialGC
    # A unica porta da loja aberta para fora: tudo passa pelo gateway.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck: &saude_gateway
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      keycloak:
        condition: service_healthy
      pedidos:
        condition: service_healthy
      estoque:
        condition: service_healthy

  # Painel da loja (React). http://localhost:5173
  web:
    <<: *seguro
    build:
      context: ./frontend
      args:
        # Local, cada um na sua porta. Na nuvem ficam vazios: tudo no mesmo dominio.
        API_URL: http://localhost:8080
        KEYCLOAK_URL: http://localhost:8180/realms/vitrine
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 64m
    ports:
      # A porta que o Keycloak aceita como destino do login (redirectUris).
      - "127.0.0.1:5173:8080"
    depends_on:
      - gateway

  # --- Observabilidade ---------------------------------------------------
  # Jaeger: recebe os traces por OTLP e mostra cada pedido atravessando os
  # servicos e o Kafka. http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    <<: *seguro
    ports:
      - "127.0.0.1:16686:16686"
    mem_limit: 256m

  prometheus:
    image: prom/prometheus:v3.15.0
    <<: *seguro
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    ports:
      # Paineis so na propria maquina, nunca na rede.
      - "127.0.0.1:9090:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:13.2
    <<: *seguro
    environment:
      # So leitura e sem login: os paineis sao codigo (infra/grafana) e mudam
      # por commit. Sem o formulario, ninguem entra com a senha padrao "admin".
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/vitrine.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  mailpit:
    image: axllent/mailpit:v1.31
    <<: *seguro
    ports:
      # Caixa de entrada de teste: http://localhost:8025
      - "127.0.0.1:8025:8025"

  pedidos:
    <<: *servico
    build:
      context: .
      args:
        SERVICO: pedidos
    healthcheck: &saude
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      <<: *ambiente
      KEYCLOAK_EMISSOR: http://localhost:8180/realms/vitrine
      KEYCLOAK_CHAVES: http://keycloak:8080/realms/vitrine/protocol/openid-connect/certs

  estoque:
    <<: *servico
    build:
      context: .
      args:
        SERVICO: estoque
    healthcheck: *saude
    environment:
      <<: *ambiente

  pagamentos:
    <<: *servico
    build:
      context: .
      args:
        SERVICO: pagamentos
    healthcheck: *saude
    environment:
      <<: *ambiente
      LIMITE_APROVACAO: "1000.00"

  notificacoes:
    <<: *servico
    build:
      context: .
      args:
        SERVICO: notificacoes
    healthcheck: *saude
    environment:
      <<: *ambiente
      SMTP_HOST: mailpit
    depends_on:
      db:
        condition: service_healthy
      kafka-topicos:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  dados_postgres:
  dados_kafka:
