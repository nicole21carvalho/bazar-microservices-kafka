# Sobe tudo com: docker compose up -d --build

x-seguro: &seguro
  # Nenhum processo dentro ganha mais privilegio que o container tem, e o
  # container nao tem nenhuma capacidade especial do Linux.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-servico: &servico
  <<: *seguro
  build:
    context: .
  read_only: true
  tmpfs:
    - /tmp:size=64m
  environment: &ambiente
    DB_HOST: db
    KAFKA_SERVIDORES: kafka:9092
    DB_SENHA_PEDIDOS: ${DB_SENHA_PEDIDOS:?defina no .env}
    DB_SENHA_ESTOQUE: ${DB_SENHA_ESTOQUE:?defina no .env}
    DB_SENHA_PAGAMENTOS: ${DB_SENHA_PAGAMENTOS:?defina no .env}
    DB_SENHA_NOTIFICACOES: ${DB_SENHA_NOTIFICACOES:?defina no .env}
    JAVA_TOOL_OPTIONS: -XX:+UseSerialGC
  mem_limit: 512m
  depends_on:
    db:
      condition: service_healthy
    kafka-topicos:
      condition: service_completed_successfully

services:
  db:
    image: postgres:18-alpine
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_PASSWORD: ${DB_SENHA_ADMIN:?defina no .env}
      DB_SENHA_PEDIDOS: ${DB_SENHA_PEDIDOS:?defina no .env}
      DB_SENHA_ESTOQUE: ${DB_SENHA_ESTOQUE:?defina no .env}
      DB_SENHA_PAGAMENTOS: ${DB_SENHA_PAGAMENTOS:?defina no .env}
      DB_SENHA_NOTIFICACOES: ${DB_SENHA_NOTIFICACOES:?defina no .env}
      DB_SENHA_KEYCLOAK: ${DB_SENHA_KEYCLOAK:?defina no .env}
    volumes:
      # No Postgres 18 o volume vai em /var/lib/postgresql, e nao em .../data.
      - dados_postgres:/var/lib/postgresql
      - ./infra/postgres/criar-bancos.sh:/docker-entrypoint-initdb.d/criar-bancos.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    <<: *seguro
    environment:
      # KRaft: o Kafka coordena o proprio cluster, sem ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Um broker so: fator de replicacao 1. Em producao, 3 brokers e fator 3.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topicos criados de proposito (kafka-topicos abaixo), nunca por engano
      # de digitacao num nome de topico.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - dados_kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Cria os topicos e termina. 3 particoes: ate 3 replicas de cada servico
  # consomem em paralelo, e a chave (pedidoId) mantem a ordem de cada pedido.
  kafka-topicos:
    image: apache/kafka:4.3.1
    <<: *seguro
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        for t in vitrine.pedidos vitrine.estoque vitrine.pagamentos; do
          for nome in $$t $$t-dlt; do
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
              --create --if-not-exists --topic $$nome --partitions 3 --replication-factor 1
          done
        done
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    <<: *seguro
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_SENHA_ADMIN:?defina no .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_SENHA_KEYCLOAK:?defina no .env}
      # O endereco que o navegador usa: vai no "iss" de todo token. Os servicos
      # buscam as chaves pelo endereco interno (keycloak:8080).
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # HTTP so porque e local. Exposto na internet, Keycloak so com HTTPS.
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/vitrine-realm.json:/opt/keycloak/data/import/vitrine-realm.json:ro
    ports:
      - "127.0.0.1:8180:8080"
    mem_limit: 768m
    healthcheck:
      # A imagem nao tem curl: a checagem fala HTTP direto pelo /dev/tcp do bash.
      # Aspas simples no YAML: as barras chegam intactas ao printf, que as interpreta.
      test: ["CMD-SHELL", 'exec 3<>/dev/tcp/localhost/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "200 OK" <&3']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  gateway:
    <<: *seguro
    build:
      context: .
      args:
        SERVICO: gateway
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 384m
    environment:
      ESTOQUE_URL: http://estoque:8082
      PEDIDOS_URL: http://pedidos:8081
      KEYCLOAK_EMISSOR: http://localhost:8180/realms/vitrine
      KEYCLOAK_CHAVES: http://keycloak:8080/realms/vitrine/protocol/openid-connect/certs
      CORS_ORIGENS: http://localhost:5173
      PORTA: 8080
      JAVA_TOOL_OPTIONS: -XX:+UseSerialGC
    # A unica porta da loja aberta para fora: tudo passa pelo gateway.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck: &saude_gateway
      test: ["CMD-SHELL", "wget -qO- http://localhost:$$PORTA/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      keycloak:
        condition: service_healthy
      pedidos:
        condition: service_healthy
      estoque:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31
    <<: *seguro
    ports:
      # Caixa de entrada de teste: http://localhost:8025
      - "127.0.0.1:8025:8025"

  pedidos:
    <<: *servico
    build:
      context: .
      args:
        SERVICO: pedidos
    healthcheck: &saude
      test: ["CMD-SHELL", "wget -qO- http://localhost:$$PORTA/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      <<: *ambiente
      PORTA: 8081
      KEYCLOAK_EMISSOR: http://localhost:8180/realms/vitrine
      KEYCLOAK_CHAVES: http://keycloak:8080/realms/vitrine/protocol/openid-connect/certs

  estoque:
    <<: *servico
    build:
      context: .
      args:
        SERVICO: estoque
    healthcheck: *saude
    environment:
      <<: *ambiente
      PORTA: 8082

  pagamentos:
    <<: *servico
    build:
      context: .
      args:
        SERVICO: pagamentos
    healthcheck: *saude
    environment:
      <<: *ambiente
      PORTA: 8083
      LIMITE_APROVACAO: "1000.00"

  notificacoes:
    <<: *servico
    build:
      context: .
      args:
        SERVICO: notificacoes
    healthcheck: *saude
    environment:
      <<: *ambiente
      PORTA: 8084
      SMTP_HOST: mailpit
    depends_on:
      db:
        condition: service_healthy
      kafka-topicos:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  dados_postgres:
  dados_kafka:
