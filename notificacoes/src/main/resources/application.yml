spring:
  application:
    name: notificacoes
  mail:
    # No docker compose, o Mailpit: recebe os e-mails e mostra numa pagina,
    # sem entregar a ninguem de verdade.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORTA:1025}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/notificacoes
    username: notificacoes
    # Sem valor padrao: a senha vem do ambiente (.env no compose, Secret no
    # Kubernetes) e nunca fica escrita no repositorio.
    password: ${DB_SENHA_NOTIFICACOES}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # As tabelas comuns (outbox, idempotencia) vem do modulo "comum".
    locations: classpath:db/comum,classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_SERVIDORES:localhost:9092}
    consumer:
      auto-offset-reset: earliest
    producer:
      # Confirmacao de todas as replicas antes de considerar o evento enviado.
      acks: all

server:
  port: 8084
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

vitrine:
  notificacoes:
    remetente: ${EMAIL_REMETENTE:nao-responda@vitrine.local}
