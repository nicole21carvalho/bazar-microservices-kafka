spring:
  application:
    name: estoque
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/estoque
    username: estoque
    # Sem valor padrao: a senha vem do ambiente (.env no compose, Secret no
    # Kubernetes) e nunca fica escrita no repositorio.
    password: ${DB_SENHA_ESTOQUE}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # As tabelas comuns (outbox, idempotencia) vem do modulo "comum".
    locations: classpath:db/comum,classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_SERVIDORES:localhost:9092}
    consumer:
      auto-offset-reset: earliest
    producer:
      # Confirmacao de todas as replicas antes de considerar o evento enviado.
      acks: all

server:
  port: 8082
  shutdown: graceful

management:
  server:
    # Actuator (saude e metricas) numa porta so de gerencia, que nunca e
    # publicada: o Prometheus e as sondas de saude falam com ela pela rede
    # interna. Na porta da aplicacao, /actuator nem existe.
    port: 9000
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
