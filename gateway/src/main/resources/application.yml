spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: produtos
              uri: ${ESTOQUE_URL:http://localhost:8082}
              predicates:
                - Path=/api/produtos/**
            - id: pedidos
              uri: ${PEDIDOS_URL:http://localhost:8081}
              predicates:
                - Path=/api/pedidos/**
  security:
    oauth2:
      resourceserver:
        jwt:
          # O "iss" dos tokens e o endereco publico do Keycloak (o do
          # navegador). As chaves sao buscadas pelo endereco interno, na rede
          # do compose ou do cluster. Com jwk-set-uri, o Spring nao tenta o
          # endereco publico de dentro do container: so confere o "iss".
          issuer-uri: ${KEYCLOAK_EMISSOR:http://localhost:8180/realms/vitrine}
          jwk-set-uri: ${KEYCLOAK_CHAVES:http://localhost:8180/realms/vitrine/protocol/openid-connect/certs}
          # O token precisa ter sido emitido para esta API. Um token valido do
          # mesmo Keycloak, mas para outro sistema, e recusado.
          audiences: vitrine-api

vitrine:
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173}
  limites:
    requisicoes-por-minuto: ${LIMITE_REQUISICOES:120}
    # Criar pedido dispara estoque, pagamento e e-mail: e a operacao mais cara.
    pedidos-por-minuto: ${LIMITE_PEDIDOS:10}
    # Um pedido com 20 itens tem menos de 2 KB de JSON.
    corpo-maximo: 16KB

server:
  port: 8080
  shutdown: graceful

management:
  server:
    # Actuator (saude e metricas) numa porta so de gerencia, que nunca e
    # publicada: o Prometheus e as sondas de saude falam com ela pela rede
    # interna. Na porta da aplicacao, /actuator nem existe.
    port: 9000
  tracing:
    sampling:
      probability: ${AMOSTRAGEM_TRACES:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
