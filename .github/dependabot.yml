# Atualizacoes automaticas de dependencias, uma vez por semana, agrupadas para
# virar poucos pull requests. Cada PR passa pelo CI inteiro antes do merge.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    groups:
      maven: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  # Imagens base dos Dockerfiles e do docker compose.
  - package-ecosystem: docker
    directories: ["/", "/frontend"]
    schedule: { interval: weekly }
    groups:
      imagens-base: { patterns: ["*"] }
    # Java e Node ficam em versoes LTS (suporte longo). Subir para o proximo
    # LTS e uma decisao, com pom, CI e README juntos; o Dependabot cuida das
    # atualizacoes menores e de seguranca dentro da versao atual.
    ignore:
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    groups:
      compose: { patterns: ["*"] }

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule: { interval: weekly }
