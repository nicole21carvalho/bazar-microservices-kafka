# Integracao e entrega continuas.
#
# Em todo pull request e push: testes (com Postgres e Kafka de verdade, via
# Testcontainers), lint, varredura de dependencias vulneraveis e validacao da
# infraestrutura (Kubernetes e Terraform).
#
# Em push na main, se tudo passar: imagens multi-arquitetura (x86 e ARM) no
# GitHub Container Registry, com SBOM, proveniencia e assinatura (cosign, sem
# chave guardada: identidade do proprio workflow via Sigstore). Com a variavel
# DEPLOY_ATIVO=true no repositorio, o job de deploy grava as novas tags em
# infra/kustomization.yaml e o Flux, de dentro do cluster, aplica sozinho.
#
# Seguranca do proprio CI: actions fixadas por SHA (uma tag pode ser movida,
# um SHA nao), permissoes minimas por job e nenhum segredo de nuvem guardado.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes (unitarios e de integracao com Testcontainers)
        run: mvn -B -ntp verify

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --ignore-scripts: nenhum pacote roda codigo na instalacao.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dependencias:
    name: Dependencias vulneraveis (SBOM + OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: SBOM CycloneDX de todos os modulos Java
        run: >-
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          -DoutputFormat=json -DoutputName=bom -DincludeTestScope=false
      # Falha o job se alguma dependencia (Java ou npm) tiver vulnerabilidade
      # conhecida na base OSV.
      - name: osv-scanner
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src
          ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
          scan source -L target/bom.json -L frontend/package-lock.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom
          path: target/bom.json

  infraestrutura:
    name: Infraestrutura (Kubernetes + Terraform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Manifestos do Kubernetes (kustomize + kubeconform)
        run: |
          kubectl kustomize infra > manifestos.yaml
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.34.0 - < manifestos.yaml
      - name: Scripts de shell (shellcheck)
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          infra/terraform/k3s/preparar-cluster.sh infra/postgres/criar-bancos.sh
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Terraform (formato e validacao)
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  imagens:
    name: Imagem ${{ matrix.nome }}
    needs: [backend, frontend, dependencias, infraestrutura]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # publicar no ghcr.io
      id-token: write # assinatura sem chave (Sigstore) e atestado
      attestations: write
    strategy:
      matrix:
        include:
          - { nome: gateway, contexto: ., servico: gateway }
          - { nome: pedidos, contexto: ., servico: pedidos }
          - { nome: estoque, contexto: ., servico: estoque }
          - { nome: pagamentos, contexto: ., servico: pagamentos }
          - { nome: notificacoes, contexto: ., servico: notificacoes }
          # Sem API_URL nem KEYCLOAK_URL: no cluster, tudo no mesmo endereco.
          - { nome: web, contexto: frontend, servico: "" }
    env:
      IMAGEM: ghcr.io/${{ github.repository_owner }}/vitrine-${{ matrix.nome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A compilacao roda na arquitetura do proprio runner (FROM
      # --platform=$BUILDPLATFORM) e a etapa final so copia arquivos: o ARM
      # sai sem emulacao.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.contexto }}
          platforms: linux/amd64,linux/arm64
          build-args: SERVICO=${{ matrix.servico }}
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.IMAGEM }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Assinatura (cosign)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGEM@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGEM }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy (GitOps)
    needs: imagens
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ATIVO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: write # o commit com as novas tags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # O CI nao fala com o cluster: so registra no repositorio qual versao
      # deve rodar. O Flux percebe o commit e aplica (em ate 5 minutos).
      - name: Novas tags em infra/kustomization.yaml
        env:
          VERSAO: ${{ github.sha }}
        run: |
          sed -i -E "s/^(\s+newTag:) .*/\1 \"$VERSAO\"/" infra/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: imagens ${VERSAO::7}"
          git pull --rebase
          git push
