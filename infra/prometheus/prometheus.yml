global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: sagaz
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:9000
          - pedidos:9000
          - estoque:9000
          - pagamentos:9000
          - notificacoes:9000
    relabel_configs:
      # "pedidos:9000" vira servico="pedidos" nos graficos. A 9000 e a porta de
      # gerencia de cada servico, que so existe na rede interna.
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: servico
